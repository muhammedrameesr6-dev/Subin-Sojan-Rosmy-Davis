<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F9E4B7" />
      <stop offset="35%" stop-color="#D4AF37" />
      <stop offset="70%" stop-color="#AA771C" />
      <stop offset="100%" stop-color="#F2D179" />
    </linearGradient>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <circle cx="100" cy="100" r="92" fill="none" stroke="url(#goldGrad)" stroke-width="1.5" stroke-dasharray="4 2" opacity="0.6"/>
  <circle cx="100" cy="100" r="86" fill="none" stroke="url(#goldGrad)" stroke-width="2"/>
  
  <!-- Laurel Wreath Left -->
  <path d="M 52 140 C 35 110, 40 70, 72 45 C 68 55, 66 65, 68 75 C 55 60, 52 80, 58 95 C 48 85, 46 102, 54 116 C 48 112, 48 125, 56 135 Z" fill="url(#goldGrad)" opacity="0.85"/>
  <!-- Laurel Wreath Right -->
  <path d="M 148 140 C 165 110, 160 70, 128 45 C 132 55, 134 65, 132 75 C 145 60, 148 80, 142 95 C 152 85, 154 102, 146 116 C 152 112, 152 125, 144 135 Z" fill="url(#goldGrad)" opacity="0.85"/>

  <!-- Top Cross Accent -->
  <g transform="translate(100, 32) scale(0.7)" fill="url(#goldGrad)" filter="url(#goldGlow)">
    <rect x="-1.5" y="-12" width="3" height="24" rx="1"/>
    <rect x="-7" y="-7" width="14" height="3" rx="1"/>
    <circle cx="0" cy="-14" r="1.5"/>
  </g>

  <!-- Monogram S & R -->
  <text x="82" y="118" font-family="'Cormorant Garamond', serif" font-size="52" font-weight="600" fill="url(#goldGrad)" text-anchor="middle" font-style="italic" filter="url(#goldGlow)">S</text>
  <text x="100" y="112" font-family="'Great Vibes', cursive, serif" font-size="28" fill="url(#goldGrad)" text-anchor="middle" opacity="0.9">&amp;</text>
  <text x="120" y="122" font-family="'Cormorant Garamond', serif" font-size="52" font-weight="600" fill="url(#goldGrad)" text-anchor="middle" font-style="italic" filter="url(#goldGlow)">R</text>

  <!-- Bottom ribbon or flourish -->
  <path d="M 70 152 Q 100 162 130 152 Q 100 157 70 152" fill="none" stroke="url(#goldGrad)" stroke-width="2"/>
  <circle cx="100" cy="156" r="3" fill="url(#goldGrad)"/>
  <circle cx="90" cy="155" r="1.5" fill="url(#goldGrad)"/>
  <circle cx="110" cy="155" r="1.5" fill="url(#goldGrad)"/>
</svg>