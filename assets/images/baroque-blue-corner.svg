<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240">
  <defs>
    <!-- Gold Gradients -->
    <linearGradient id="baroqueGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF3D1" />
      <stop offset="30%" stop-color="#E5C17D" />
      <stop offset="65%" stop-color="#C29747" />
      <stop offset="85%" stop-color="#8C6521" />
      <stop offset="100%" stop-color="#F2D696" />
    </linearGradient>

    <linearGradient id="roseBlue1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2D58A6" />
      <stop offset="50%" stop-color="#18366E" />
      <stop offset="100%" stop-color="#091A3E" />
    </linearGradient>

    <linearGradient id="roseBlue2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4678CE" />
      <stop offset="50%" stop-color="#20448A" />
      <stop offset="100%" stop-color="#0E224F" />
    </linearGradient>

    <filter id="shadowFiligree" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <g filter="url(#shadowFiligree)">
    <!-- 1. BAROQUE GOLD ACANTHUS SCROLLWORK -->
    <!-- Top horizontal border scroll -->
    <path d="M 0 0 L 140 0 C 130 12, 110 15, 95 8 C 80 2, 70 14, 55 16 C 40 18, 25 10, 16 25 C 8 38, 16 52, 12 70 C 8 85, 0 100, 0 140 Z" fill="url(#baroqueGold)" opacity="0.95"/>
    
    <!-- Elaborate filigree curls & swirls -->
    <path d="M 2 15 C 18 12, 35 25, 48 18 C 60 12, 75 22, 90 14 C 105 6, 125 18, 145 8 C 135 24, 115 28, 98 22 C 82 16, 68 32, 48 28 C 30 25, 20 40, 15 55 C 10 70, 22 85, 14 105 C 8 120, 2 135, 0 145 C 5 125, 18 112, 16 95 C 14 78, 26 62, 22 45 C 18 28, 6 22, 2 15 Z" fill="#FFEBB8"/>
    
    <!-- Outer acanthus leaf ridges -->
    <path d="M 12 2 C 28 8, 42 4, 58 10 C 72 16, 88 12, 102 18 C 118 24, 132 18, 150 25 C 138 32, 122 28, 110 35 C 95 42, 82 32, 68 38 C 52 44, 40 58, 32 72 C 24 88, 30 105, 22 122 C 16 138, 22 155, 15 172 C 10 155, 8 138, 8 120 C 8 95, 16 75, 8 50 C 4 35, 10 18, 12 2 Z" fill="url(#baroqueGold)" stroke="#684711" stroke-width="0.5"/>

    <!-- Acanthus Leaf Flourishes -->
    <path d="M 50 16 Q 70 30 90 20 Q 75 35 50 16 Z" fill="#FFF0D0"/>
    <path d="M 16 50 Q 30 70 20 90 Q 35 75 16 50 Z" fill="#FFF0D0"/>
    
    <!-- Golden Rococo Beads / Pearls -->
    <circle cx="8" cy="8" r="3.5" fill="#FFF8E0" stroke="#8C6521" stroke-width="0.8"/>
    <circle cx="22" cy="7" r="2.8" fill="#FFF8E0" stroke="#8C6521" stroke-width="0.6"/>
    <circle cx="36" cy="6" r="2.5" fill="#FFF8E0" stroke="#8C6521" stroke-width="0.6"/>
    <circle cx="50" cy="5" r="2.2" fill="#FFF8E0" stroke="#8C6521" stroke-width="0.6"/>
    <circle cx="7" cy="22" r="2.8" fill="#FFF8E0" stroke="#8C6521" stroke-width="0.6"/>
    <circle cx="6" cy="36" r="2.5" fill="#FFF8E0" stroke="#8C6521" stroke-width="0.6"/>
    <circle cx="5" cy="50" r="2.2" fill="#FFF8E0" stroke="#8C6521" stroke-width="0.6"/>

    <!-- 2. ROYAL NAVY BLUE ROSES & BLOSSOMS -->
    <!-- Large Central Rose -->
    <g transform="translate(68, 68)">
      <!-- Outer Petals -->
      <path d="M 0 -36 C 18 -36, 34 -24, 36 -6 C 38 12, 28 28, 12 34 C -4 40, -24 34, -32 20 C -40 6, -34 -18, -20 -28 C -8 -36, -8 -36, 0 -36 Z" fill="url(#roseBlue1)"/>
      <path d="M -18 -30 C -2 -34, 16 -32, 26 -20 C 36 -8, 32 14, 22 26 C 12 36, -10 36, -22 26 C -34 16, -34 -8, -26 -22 Z" fill="url(#roseBlue2)"/>
      <!-- Inner Petal Layers -->
      <path d="M -14 -18 C -2 -24, 14 -22, 20 -12 C 26 -2, 22 14, 14 20 C 6 26, -10 24, -16 16 C -22 8, -22 -10, -14 -18 Z" fill="#142C5B"/>
      <path d="M -10 -12 C 0 -16, 12 -14, 16 -6 C 20 2, 16 12, 8 16 C 0 20, -10 18, -14 10 C -18 2, -16 -6, -10 -12 Z" fill="#29529E"/>
      <!-- Rose Bud Spiral -->
      <path d="M -6 -6 C 0 -9, 8 -7, 10 -2 C 12 3, 9 8, 4 10 C -1 12, -7 9, -8 4 C -9 -1, -6 -6, -6 -6 Z" fill="#0C1B3A"/>
      <path d="M -2 -3 Q 3 -4 4 -1 Q 5 2 2 3 Q -1 4 -3 1 Z" fill="#4B77C2"/>
      <!-- Gold Stamen Accents -->
      <circle cx="-1" cy="-1" r="1.5" fill="#FFEBA8"/>
      <circle cx="2" cy="1" r="1.2" fill="#FFEBA8"/>
      <circle cx="-2" cy="2" r="1" fill="#FFEBA8"/>
    </g>

    <!-- Medium Secondary Rose (Top) -->
    <g transform="translate(108, 38) scale(0.68)">
      <path d="M 0 -32 C 18 -32, 32 -20, 32 -4 C 32 12, 22 26, 8 30 C -8 34, -24 28, -28 14 C -32 0, -26 -18, -14 -26 Z" fill="url(#roseBlue1)"/>
      <path d="M -14 -22 C 0 -26, 16 -24, 22 -12 C 28 0, 24 16, 14 22 C 4 28, -10 26, -18 16 C -26 6, -24 -10, -14 -22 Z" fill="url(#roseBlue2)"/>
      <path d="M -8 -10 C 2 -14, 12 -12, 14 -4 C 16 4, 12 12, 4 14 C -4 16, -12 12, -12 4 Z" fill="#142C5B"/>
      <circle cx="0" cy="0" r="3" fill="#FFEBA8"/>
    </g>

    <!-- Medium Secondary Rose (Left) -->
    <g transform="translate(38, 108) scale(0.68)">
      <path d="M 0 -32 C 18 -32, 32 -20, 32 -4 C 32 12, 22 26, 8 30 C -8 34, -24 28, -28 14 C -32 0, -26 -18, -14 -26 Z" fill="url(#roseBlue1)"/>
      <path d="M -14 -22 C 0 -26, 16 -24, 22 -12 C 28 0, 24 16, 14 22 C 4 28, -10 26, -18 16 C -26 6, -24 -10, -14 -22 Z" fill="url(#roseBlue2)"/>
      <path d="M -8 -10 C 2 -14, 12 -12, 14 -4 C 16 4, 12 12, 4 14 C -4 16, -12 12, -12 4 Z" fill="#142C5B"/>
      <circle cx="0" cy="0" r="3" fill="#FFEBA8"/>
    </g>

    <!-- Golden Leaves & Foliage Around Roses -->
    <path d="M 85 40 Q 100 25 118 32 Q 105 45 85 40 Z" fill="url(#baroqueGold)"/>
    <path d="M 40 85 Q 25 100 32 118 Q 45 105 40 85 Z" fill="url(#baroqueGold)"/>
    <path d="M 100 68 Q 125 65 130 80 Q 112 85 100 68 Z" fill="url(#baroqueGold)"/>
    <path d="M 68 100 Q 65 125 80 130 Q 85 112 68 100 Z" fill="url(#baroqueGold)"/>
    <path d="M 120 48 Q 140 45 145 60 Q 130 65 120 48 Z" fill="url(#baroqueGold)" opacity="0.85"/>
    <path d="M 48 120 Q 45 140 60 145 Q 65 130 48 120 Z" fill="url(#baroqueGold)" opacity="0.85"/>

    <!-- Small Ivory/Champagne Bud Flowers -->
    <g transform="translate(138, 75) scale(0.4)">
      <circle cx="-10" cy="0" r="12" fill="#FFF2D6" stroke="#C29747" stroke-width="1.5"/>
      <circle cx="10" cy="0" r="12" fill="#FFF2D6" stroke="#C29747" stroke-width="1.5"/>
      <circle cx="0" cy="-10" r="12" fill="#FFF2D6" stroke="#C29747" stroke-width="1.5"/>
      <circle cx="0" cy="10" r="12" fill="#FFF2D6" stroke="#C29747" stroke-width="1.5"/>
      <circle cx="0" cy="0" r="7" fill="#C29747"/>
    </g>
    <g transform="translate(75, 138) scale(0.4)">
      <circle cx="-10" cy="0" r="12" fill="#FFF2D6" stroke="#C29747" stroke-width="1.5"/>
      <circle cx="10" cy="0" r="12" fill="#FFF2D6" stroke="#C29747" stroke-width="1.5"/>
      <circle cx="0" cy="-10" r="12" fill="#FFF2D6" stroke="#C29747" stroke-width="1.5"/>
      <circle cx="0" cy="10" r="12" fill="#FFF2D6" stroke="#C29747" stroke-width="1.5"/>
      <circle cx="0" cy="0" r="7" fill="#C29747"/>
    </g>
  </g>
</svg>